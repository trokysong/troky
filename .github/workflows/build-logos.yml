name: Build Plex Logos
on:
  workflow_dispatch:
  push:
    paths:
      - generate_logos.py
      - .github/workflows/build-logos.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python generate_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/*.png
          git diff --cached --quiet || git commit -m "Build Plex PNG logos"
          git push
